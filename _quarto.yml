project:
  type: book

book:
  title: "Introduction to Digital History"
  author: <a href="https://orcid.org/0000-0003-2419-4252">Ina Serif</a>
  search: true
  repo-url: https://github.com/wissen-ist-acht/digital_history_intro/
  repo-actions: [edit]
  downloads: [pdf]
  page-footer:
    left: |
      This work is licensed under <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/">CC-NC-SA 4.0</a>.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  chapters:
    - index.qmd
    - part: "Einführung"
      part-en: "Introduction"
      chapters:
        - 01_intro.qmd
        - 02_forschung_lehre.qmd
        - 03_digital_literacy_criticism.qmd
        - 04_datenerhebung_analyse.qmd
        - 05_FAIR_CARE.qmd
    - part: "Praktischer Teil"
      part-en: "Practical Section"
      chapters:
        - Praxis.qmd
        - 06_Briefedition_Sturm.qmd
        - 07_Vordereingang.qmd
        - 08_Hintertuer.qmd
        - 09_Ausblick.qmd
  appendices:
    - terms.qmd
    - further_resources.qmd

bibliography:
  - references.bib
csl: infoclio-de.csl
format:
  html:
      theme:
        - cosmo
  pdf:
    documentclass: scrreprt
    date: last-modified
    date-format: "[Last compiled on] DD.MM.YYYY"
    subtitle: https://wissen-ist-acht.github.io/digitalhistory.intro/
    cite-method: biblatex
    biblio-title: References

babelquarto:
  languagecodes:
  - name: de
    text: "Deutsch"
  - name: en
    text: "English"
  mainlanguage: de
  languages: [en]
title-en: Introduction to Digital History
description-en: 
abstract-en: 
author-en: Ina Serif
title-de: Introduction to Digital History
description-de: 
abstract-de: 
